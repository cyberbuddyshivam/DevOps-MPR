# =============================================================================
# FindIT — GitHub Actions CI Pipeline (Experiment 3: Continuous Integration)
# Jira Ticket: FIND-07
# Triggers: push or pull_request to main or develop branches
#
# Jobs (run sequentially within the ci job):
#   1. checkout            — Fetch repository code
#   2. node-setup          — Install Node.js 20 LTS with npm cache
#   3. backend-install     — npm ci for backend (reproducible installs)
#   4. backend-lint        — ESLint static analysis on src/ and tests/
#   5. backend-test        — Jest unit + API tests (in-memory DB, no Postgres required)
#   6. frontend-install    — npm ci for frontend
#   7. frontend-lint       — ESLint on frontend src/
#   8. frontend-build      — Vite production build (validates no broken imports/types)
#   9. docker-build-check  — Build both Docker images (build-only, no push) to validate
#                            Dockerfiles compile correctly against committed source
# =============================================================================

name: FindIT CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Backend — Lint, Test, (in-memory DB, no Postgres service needed)
  # ---------------------------------------------------------------------------
  backend-ci:
    name: "Backend — Lint & Test"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: "📦 Install backend dependencies"
        working-directory: backend
        run: npm ci

      - name: "🔍 Lint backend source (ESLint)"
        working-directory: backend
        run: npm run lint

      - name: "🧪 Run backend tests (Jest — unit + API integration)"
        working-directory: backend
        # NODE_ENV=test ensures in-memory DB fallback is used (no live Postgres needed)
        # The db.js model gracefully falls back when Postgres is unreachable
        env:
          NODE_ENV: test
          PORT: 5000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: findit_db
        run: npm test

      - name: "📊 Upload test results (artifact)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # JOB 2: Frontend — Lint & Production Build
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: "Frontend — Lint & Build"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "📦 Install frontend dependencies"
        working-directory: frontend
        run: npm ci

      - name: "🔍 Lint frontend source (ESLint)"
        working-directory: frontend
        run: npm run lint
        # Note: frontend lint will warn but not fail the build for now
        # to match the academic scope. Use continue-on-error for strictness control.
        continue-on-error: true

      - name: "🏗️ Build frontend (Vite production bundle)"
        working-directory: frontend
        run: npm run build

      - name: "📦 Upload frontend build artifact"
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # JOB 3: Docker Build Check (Exp 3 + Exp 5 integration validation)
  # Builds both Docker images to confirm Dockerfiles are valid.
  # Does NOT push to a registry (no credentials required).
  # This job runs only after both lint/test jobs pass.
  # ---------------------------------------------------------------------------
  docker-build-check:
    name: "Docker — Build Image Validation"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🐳 Build backend Docker image (no push)"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: findit-backend:ci-${{ github.sha }}
          # Cache layers between runs for faster CI
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "🐳 Build frontend Docker image (no push)"
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: findit-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # JOB 4: CI Status Summary
  # Provides a clear final gate that PR status checks can reference
  # ---------------------------------------------------------------------------
  ci-status:
    name: "✅ CI Complete"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-build-check]
    if: always()

    steps:
      - name: "Report CI status"
        run: |
          echo "======================================"
          echo "FindIT CI Pipeline — Job Summary"
          echo "======================================"
          echo "Backend Lint & Test : ${{ needs.backend-ci.result }}"
          echo "Frontend Lint & Build: ${{ needs.frontend-ci.result }}"
          echo "Docker Build Check  : ${{ needs.docker-build-check.result }}"
          echo "======================================"
          if [[ "${{ needs.backend-ci.result }}" != "success" || \
                "${{ needs.frontend-ci.result }}" != "success" || \
                "${{ needs.docker-build-check.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs FAILED"
            exit 1
          fi
          echo "✅ All CI jobs PASSED — Code is ready for review / merge"

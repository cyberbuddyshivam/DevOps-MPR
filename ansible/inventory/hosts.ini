# =============================================================================
# FindIT — Ansible Inventory (Experiment 4: Configuration Management)
# Jira Ticket: FIND-10
#
# Defines target hosts for automated provisioning & deployment
# =============================================================================

[local]
# Local testing target (WSL, local VM, or CI container)
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[app_servers]
# Production / Staging target server (update IP or hostname for lab VM)
127.0.0.1 ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Example remote server configuration:
# staging.findit.internal ansible_host=192.168.1.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
app_name=findit
app_dir=/opt/findit
app_user=deploy
app_group=deploy
postgres_user=postgres
postgres_password=postgres_secure_pass_2026
postgres_db=findit_db
db_port=5432
backend_port=5000
frontend_port=3000
docker_compose_version=2.27.0
